<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mac Feishu Payroll — Module</title>
<style>:root{--nav:#172554;--nav2:#1e3a8a;--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#172033;--muted:#64748b;--ok:#087f5b;--bad:#c92a2a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{display:flex;min-height:100vh}.side{width:220px;background:var(--nav);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:18px;padding:4px 10px 18px}.brand small{display:block;font-weight:500;font-size:11px;opacity:.7;margin-top:3px}.nav{display:grid;gap:6px}.nav a{color:#dbeafe;text-decoration:none;padding:11px 12px;border-radius:9px;font-size:14px}.nav a.active{background:#fff;color:var(--nav);font-weight:700}.main{margin-left:220px;width:calc(100% - 220px)}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.title b{font-size:18px}.title span{display:block;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--nav2);color:#fff;border-color:var(--nav2)}.wrap{padding:20px}.status,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}.months{display:grid;grid-template-columns:repeat(12,minmax(65px,1fr));gap:6px;margin-bottom:14px}.month{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;cursor:pointer;font-size:12px}.month.active{background:var(--nav2);color:#fff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.card small{color:var(--muted);display:block}.card strong{font-size:20px;display:block;margin-top:4px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:1100px;background:#fff}.table th,.table td{padding:8px 9px;border-bottom:1px solid #eef2f7;text-align:left;font-size:12px;white-space:nowrap}.table th{background:#f8fafc;position:sticky;top:0}.tag{padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:11px}.tag.ok{background:#dcfce7}.tag.warn{background:#fef3c7}.upload{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.file{max-width:340px}.notice{padding:10px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;margin-bottom:10px}@media(max-width:900px){.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px)}.cards{grid-template-columns:repeat(2,1fr)}.months{grid-template-columns:repeat(6,1fr)}}</style></head>
<body><div class="app"><aside class="side"><div class="brand">MAC FEISHU PAYROLL<small>Production Payroll</small></div><nav class="nav"><a href="./index.html">01 Dashboard</a><a id="nav-employee" href="./module.html?module=employee">02 Employee</a><a id="nav-attendance" href="./module.html?module=attendance">03 Attendance</a><a id="nav-kpi" href="./module.html?module=kpi">04 KPI / Commission</a><a href="./payroll.html">05 Payroll</a><a id="nav-payslip" href="./module.html?module=payslip">06 Payslip</a><a id="nav-reports" href="./module.html?module=reports">07 Reports</a><a id="nav-settings" href="./module.html?module=settings">08 Settings</a></nav></aside>
<main class="main"><header class="top"><div class="title"><b id="title">Module</b><span id="subtitle">Live Feishu data · no mock rows</span></div><div class="actions"><button class="btn" id="refresh">↻ Refresh</button><button class="btn" id="logout">ออกจากระบบ</button></div></header><div class="wrap"><div class="months" id="months"></div><div class="status" id="status">ตรวจสอบ Session...</div><div class="cards" id="cards"></div><section class="panel"><h3 id="heading"></h3><div id="toolbar"></div><div id="content" class="muted">กำลังโหลดข้อมูลจริง...</div></section></div></main></div>
<script src="./config.js"></script><script type="module">import{apiFetch}from'./api.js';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),module=q.get('module')||'employee',year=new Date().getFullYear();let month=q.get('month')||`${year}-${String(new Date().getMonth()+1).padStart(2,'0')}`;let syncData=null;
const MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const META={employee:['02 Employee','Employee Master'],attendance:['03 Attendance','Attendance / Leave / OT'],kpi:['04 KPI / Commission','KPI / Commission'],payslip:['06 Payslip','Payslip / Payroll'],reports:['07 Reports','Reports'],settings:['08 Settings','System Settings']};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});const val=(f,n)=>{const v=f?.[n];if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.text||x.name||x.id||''):x).join(', ');return typeof v==='object'?(v?.text||v?.name||v?.id||''):v??''};
function nav(){document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));document.getElementById('nav-'+module)?.classList.add('active')}
function months(){if(module==='settings'){$('months').innerHTML='';return}$('months').innerHTML=MONTHS.map((m,i)=>{const k=`${year}-${String(i+1).padStart(2,'0')}`;return `<button class="month ${k===month?'active':''}" data-m="${k}">${m}</button>`}).join('');document.querySelectorAll('.month').forEach(b=>b.onclick=()=>{month=b.dataset.m;history.replaceState(null,'',`module.html?module=${module}&month=${month}`);months();load()})}
function cards(d){const keys=['companies','departments','positions','employees','attendanceSummary','payroll','payrollItems','payslips'];$('cards').innerHTML=keys.map(k=>`<div class="card"><small>${k}</small><strong>${Number(d[k]?.count||0)}</strong><small>${esc(d[k]?.status||'')}</small></div>`).join('')}
function generic(rows,headers){if(!rows.length)return '<div class="muted">ไม่พบข้อมูลจริง</div>';const keys=headers||[...new Set(rows.flatMap(r=>Object.keys(r.fields||{})))].slice(0,18);return `<div class="tablewrap"><table class="table"><thead><tr><th>Record ID</th>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.record_id)}</td>${keys.map(k=>`<td>${esc(val(r.fields,k))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function employeeView(rows){const headers=['EmployeeID','Name','Nickname','Company','Department','Position','JoinDate','Salary','Status Employees','Status'];return `<div class="notice">ข้อมูลพนักงานอ่านจาก Feishu Base โดยตรง · ${rows.length} records</div>${generic(rows,headers)}`}
function attendanceView(){return `<div class="notice">นำเข้าไฟล์ .xlsx จาก Feishu Attendance Statistics Report แล้วกด Preview ก่อน หากตรวจสอบผ่านจึงกด Import to Feishu</div><div class="upload"><input class="file" id="file" type="file" accept=".xlsx,.xls"><button class="btn primary" id="previewImport">Preview XLSX</button><button class="btn" id="commitImport">Import to Feishu</button></div><div id="importResult" style="margin-top:12px"></div>${generic(syncData?.attendanceSummary?.records||[])}`}
function kpiView(){return `<div class="notice">KPI / Commission ของเดือนที่เลือกจะอ้างอิง Performance Month = เดือนก่อนหน้า และตรวจสิทธิ์จาก JoinDate + WorkDays ครบ 30 วัน</div><button class="btn primary" id="previewKpi">ตรวจ Eligibility / KPI เดือน ${esc(month)}</button><div id="kpiResult" style="margin-top:12px"></div>`}
function payslipView(){return `<div class="notice">Payslip ใช้ Payroll ที่คำนวณจากข้อมูลจริง ไม่สร้างข้อมูลจำลอง</div>${generic(syncData?.payslips?.records?.length?syncData.payslips.records:syncData?.payroll?.records||[])}`}
function reportsView(){return `<div class="notice">รายงาน Payroll สามารถดาวน์โหลดแยก STARLIVE และ IAMDP จากหน้า 05 Payroll</div>${generic(syncData?.payroll?.records||[])}`}
function settingsView(){return `<div class="notice"><b>Production configuration</b><br>Secrets ไม่แสดงใน Browser และไม่สามารถแก้จากหน้าเว็บนี้</div><p>Feishu: <span class="tag ok">Connected</span></p><p>Payroll write: server-side gate</p><p>Attendance import: server-side gate</p>`}
function render(){const d=syncData?.data||{};cards(d);if(module==='employee')$('content').innerHTML=employeeView(d.employees?.records||[]);else if(module==='attendance'){$('content').innerHTML=attendanceView();bindAttendance()}else if(module==='kpi'){$('content').innerHTML=kpiView();bindKpi()}else if(module==='payslip')$('content').innerHTML=payslipView();else if(module==='reports')$('content').innerHTML=reportsView();else if(module==='settings')$('content').innerHTML=settingsView()}
async function load(){ $('status').textContent='กำลังอ่านข้อมูลจริงจาก Feishu...';try{const r=await apiFetch('/api/sync');const j=await r.json();if(!j.ok)throw new Error(j.error||'Sync failed');syncData=j;$('status').innerHTML='<span class="ok">● Connected</span> · '+new Date(j.syncedAt).toLocaleString('th-TH');render()}catch(e){$('status').innerHTML='<span class="bad">● Feishu Sync failed</span> · '+esc(e.message);$('content').innerHTML='<div class="bad">ไม่มีการแสดงข้อมูลจำลอง</div>'}}
async function bindAttendance(){const preview=async(commit)=>{const f=$('file').files[0];if(!f){$('importResult').innerHTML='<span class="bad">เลือกไฟล์ XLSX ก่อน</span>';return}const fd=new FormData();fd.append('file',f);fd.append('month',month);const url=commit?'/api/attendance/import?commit=true':'/api/attendance/import';$('importResult').textContent=commit?'กำลัง Import เข้า Feishu...':'กำลังตรวจสอบ XLSX...';try{const r=await apiFetch(url,{method:'POST',body:fd});const j=await r.json();if(!j.ok)throw new Error(j.error||'Import failed');$('importResult').innerHTML=`<div class="tag ok">${esc(j.mode||'PREVIEW')} · ${Number(j.parsed?.rowCount||0)} rows</div><pre style="white-space:pre-wrap">${esc(JSON.stringify(j.validation||j.result||{},null,2))}</pre>`;if(commit)load()}catch(e){$('importResult').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}};$('previewImport').onclick=()=>preview(false);$('commitImport').onclick=()=>preview(true)}
async function bindKpi(){$('previewKpi').onclick=async()=>{const el=$('kpiResult');el.textContent='กำลังตรวจ...';try{const r=await apiFetch(`/api/payroll-preview/${month}`);const j=await r.json();if(!j.ok)throw new Error(j.error||'Preview failed');const rows=j.transaction.rows||[];const eligible=rows.filter(x=>x.kpiEligible||x.commissionEligible);el.innerHTML=`<div class="tag ok">${eligible.length} eligible / ${rows.length} employees</div><div class="tablewrap"><table class="table"><thead><tr>${['employeeId','name','company','position','performanceMonth','performanceWorkDays','kpiEligible','commissionEligible','kpi','commission','eligibilityReason'].map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${eligible.map(x=>`<tr>${[x.employeeId,x.name,x.company,x.position,x.performanceMonth,x.performanceWorkDays,x.kpiEligible?'YES':'NO',x.commissionEligible?'YES':'NO',money(x.kpi),money(x.commission),x.eligibilityReason].map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}catch(e){el.innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}}
async function session(){try{const r=await apiFetch('/api/auth/status');const j=await r.json();if(!j.authenticated){location.href='login.html';return false}return true}catch{return false}}
$('title').textContent=META[module]?.[0]||'Module';$('heading').textContent=META[module]?.[1]||'Module';nav();months();$('refresh').onclick=load;$('logout').onclick=async()=>{try{await apiFetch('/api/auth/logout',{method:'POST'})}finally{location.href='login.html'}};session().then(ok=>ok&&load());
</script></body></html>

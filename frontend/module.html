<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mac Feishu Payroll — Module</title>
<style>
:root{--nav:#172554;--nav2:#1e3a8a;--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#172033;--muted:#64748b;--ok:#087f5b;--bad:#c92a2a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{display:flex;min-height:100vh}.side{width:220px;background:var(--nav);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:18px;padding:4px 10px 18px}.brand small{display:block;font-weight:500;font-size:11px;opacity:.7;margin-top:3px}.nav{display:grid;gap:6px}.nav a{color:#dbeafe;text-decoration:none;padding:11px 12px;border-radius:9px;font-size:14px}.nav a.active{background:#fff;color:var(--nav);font-weight:700}.main{margin-left:220px;width:calc(100% - 220px)}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between}.title b{font-size:18px}.title span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.actions{display:flex;gap:8px}.btn{border:1px solid #cbd5e1;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--nav2);color:#fff;border-color:var(--nav2)}.wrap{padding:20px}.status,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.card small{color:var(--muted);display:block}.card strong{font-size:20px;display:block;margin-top:4px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:1000px;background:#fff}.table th,.table td{padding:8px 9px;border-bottom:1px solid #eef2f7;text-align:left;font-size:12px;white-space:nowrap}.table th{background:#f8fafc}.num{text-align:right!important}.tag{padding:3px 7px;border-radius:999px;font-size:11px;background:#eef2ff}.tag.ok{background:#dcfce7}.tag.warn{background:#fef3c7}
@media(max-width:900px){.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px)}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">MAC FEISHU PAYROLL<small>Production Payroll</small></div><nav class="nav">
<a href="./index.html">01 Dashboard</a><a id="nav-employee" href="./module.html?module=employee">02 Employee</a><a id="nav-attendance" href="./module.html?module=attendance">03 Attendance</a><a id="nav-kpi" href="./module.html?module=kpi">04 KPI / Commission</a><a href="./payroll.html">05 Payroll</a><a id="nav-payslip" href="./module.html?module=payslip">06 Payslip</a><a id="nav-reports" href="./module.html?module=reports">07 Reports</a><a id="nav-settings" href="./module.html?module=settings">08 Settings</a>
</nav></aside><main class="main"><header class="top"><div class="title"><b id="title">Module</b><span>Live Feishu data · no mock rows</span></div><div class="actions"><button class="btn" id="refresh">↻ Refresh Feishu</button><button class="btn" id="logout">ออกจากระบบ</button></div></header><div class="wrap"><div class="status" id="status">ตรวจสอบ Session...</div><div class="cards" id="cards"></div><section class="panel"><h3 id="heading"></h3><div id="content" class="muted">กำลังโหลดข้อมูลจริงจาก Feishu...</div></section></div></main></div>
<script src="./config.js"></script><script type="module">
import {apiFetch} from './api.js';
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); const money=v=>Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const q=new URLSearchParams(location.search), module=q.get('module')||'employee';
const META={employee:['02 Employee','Employees'],attendance:['03 Attendance','Attendance Summary'],kpi:['04 KPI / Commission','KPI / Commission'],payslip:['06 Payslip','Payslip / Payroll'],reports:['07 Reports','Reports'],settings:['08 Settings','System Settings']};
const keyMap={employee:'employees',attendance:'attendanceSummary',kpi:'payrollItems',payslip:'payroll'};
function nav(){document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active')); const x=document.getElementById('nav-'+module); if(x)x.classList.add('active');}
function cards(d){const keys=Object.keys(d||{});$('cards').innerHTML=keys.map(k=>`<div class="card"><small>${esc(k)}</small><strong>${Number(d[k]?.count||0)}</strong><small>${esc(d[k]?.status||'')}</small></div>`).join('');}
function tableFor(kind,rows){
 if(!rows.length){return '<div class="muted">ไม่พบข้อมูลจริงใน Feishu สำหรับโมดูลนี้</div>';}
 const keys=[...new Set(rows.flatMap(r=>Object.keys(r.fields||{})))].slice(0,16);
 return `<div class="tablewrap"><table class="table"><thead><tr><th>Record ID</th>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.record_id)}</td>${keys.map(k=>{const v=r.fields?.[k]; const z=Array.isArray(v)?v.map(x=>typeof x==='object'?(x.text||x.name||x.id||''):x).join(', '):typeof v==='object'?(v?.text||v?.name||v?.id||''):v; return `<td>${esc(z)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function render(j){const d=j.data||{}; cards(d); const k=keyMap[module]; if(module==='reports'){const p=d.payroll?.records||[]; $('content').innerHTML=`<p>รายงานใช้ข้อมูล Payroll จริงจาก Feishu เท่านั้น</p>${tableFor('reports',p)}`;return;} if(module==='settings'){ $('content').innerHTML=`<p>สถานะการเชื่อมต่อ: <span class="tag ok">Feishu API Connected</span></p><p class="muted">หน้านี้ไม่แสดง App Secret / Session Secret และไม่แก้ไข production configuration จาก browser</p>`;return;} $('content').innerHTML=tableFor(k,d[k]?.records||[]);}
async function load(){ $('status').textContent='กำลังอ่านข้อมูลจริงจาก Feishu...'; try{const r=await apiFetch('/api/sync'); const j=await r.json(); if(!j.ok)throw new Error(j.error||'Sync failed'); $('status').innerHTML='<span class="ok">● Connected</span> · '+new Date(j.syncedAt).toLocaleString('th-TH'); render(j);}catch(e){$('status').innerHTML='<span class="bad">● Feishu Sync failed</span> · '+esc(e.message); $('content').innerHTML='<div class="bad">ยังไม่สามารถอ่านข้อมูลจริงได้ จึงไม่มีการแสดงข้อมูลจำลอง</div>';}}
async function session(){try{const r=await apiFetch('/api/auth/status');const j=await r.json();if(!j.authenticated){location.href='login.html';return false;}return true;}catch{return false;}}
$('title').textContent=META[module]?.[0]||'Module';$('heading').textContent=META[module]?.[1]||'Module';nav();$('refresh').onclick=load;$('logout').onclick=async()=>{try{await apiFetch('/api/auth/logout',{method:'POST'})}finally{location.href='login.html'}};session().then(ok=>ok&&load());
</script></body></html>

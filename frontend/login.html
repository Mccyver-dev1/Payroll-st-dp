<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mac Feishu Payroll — Login</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:#e8eef8;
  min-height:100vh;
  margin:0;
  display:flex;
  flex-direction:column
}
.page{
  flex:1;
  display:grid;
  place-items:center;
  padding:28px 18px
}
.card{
  width:min(420px,100%);
  background:#111b2e;
  border:1px solid #263653;
  border-radius:16px;
  padding:26px;
  box-shadow:0 18px 50px rgba(0,0,0,.25)
}
h1{margin:0 0 8px;font-size:32px}
.muted{color:#91a4c0;margin:0 0 22px}
label{
  display:block;
  margin:0 0 6px;
  font-weight:600
}
input{
  width:100%;
  margin:0 0 14px;
  padding:12px;
  border-radius:8px;
  border:1px solid #405170;
  background:#0d1628;
  color:#fff;
  font-size:16px
}
.password-wrap{position:relative}
.password-wrap input{padding-right:48px}
.toggle-password{
  position:absolute;
  right:8px;
  top:6px;
  width:38px;
  height:38px;
  padding:0;
  border:0;
  background:transparent;
  color:#91a4c0;
  font-size:18px;
  cursor:pointer;
  border-radius:6px
}
.toggle-password:hover{
  background:#1a2942;
  color:#fff
}
.toggle-password:focus-visible{
  outline:2px solid #6ea8fe
}
.signin{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:600
}
.signin:hover{background:#e8eef8}
.signin:disabled{
  opacity:.65;
  cursor:wait
}
.bad{
  color:#ff7b7b;
  min-height:22px;
  margin:12px 0 0
}
.footer{
  text-align:center;
  color:#7183a0;
  font-size:12px;
  padding:14px 18px 18px
}
.version{color:#91a4c0}
</style>
</head>

<body>

<div class="page">
  <div class="card">

    <h1>Mac Feishu Payroll</h1>
    <p class="muted">Production authentication</p>

    <form id="form">

      <label for="username">Username</label>
      <input
        id="username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <div class="password-wrap">

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="แสดงรหัสผ่าน"
          aria-pressed="false"
        >👁</button>

      </div>

      <button
        class="signin"
        id="signin"
        type="submit"
      >Sign in</button>

    </form>

    <p id="error" class="bad"></p>

  </div>
</div>

<footer class="footer">
  © 2026 SIAM-HRBP PayrollSoft
  <span class="version">
    • v1.0.0 • STEP 15 — Data Integrity Audit
  </span>
</footer>

<script src="./config.js"></script>

<script type="module">

import {apiFetch} from './api.js';

const $ = id => document.getElementById(id);

/* Show / Hide Password */
$('togglePassword').addEventListener('click', () => {

  const input = $('password');

  const visible = input.type === 'text';

  input.type = visible ? 'password' : 'text';

  $('togglePassword').textContent =
    visible ? '👁' : '🙈';

  $('togglePassword').setAttribute(
    'aria-label',
    visible ? 'แสดงรหัสผ่าน' : 'ซ่อนรหัสผ่าน'
  );

  $('togglePassword').setAttribute(
    'aria-pressed',
    String(!visible)
  );

});


/* Login */
$('form').onsubmit = async e => {

  e.preventDefault();

  $('error').textContent = '';

  $('signin').disabled = true;

  $('signin').textContent = 'Signing in...';

  try {

    const r = await apiFetch(
      '/api/auth/login',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          username:$('username').value,
          password:$('password').value
        })
      }
    );

    const j = await r.json();

    if(!j.ok){
      throw Error(j.error || 'Login failed');
    }

    location.href = 'index.html';

  } catch(err) {

    $('error').textContent = err.message;

  } finally {

    $('signin').disabled = false;

    $('signin').textContent = 'Sign in';

  }

};

</script>

</body>
</html>

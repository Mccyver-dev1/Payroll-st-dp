<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mac Feishu Payroll</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#1f2329}.top{padding:18px 24px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid #ccc;background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.wrap{padding:24px}.status{padding:12px 16px;background:#fff;border:1px solid #ddd;border-radius:12px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;padding:16px;border:1px solid #ddd;border-radius:12px}table{width:100%;background:#fff;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.ok{color:#087f5b}.bad{color:#c92a2a}
</style></head>
<body><header class="top"><div><b>Mac Feishu Payroll</b><div>Real Feishu Sync — no mock data</div></div><button class="btn" onclick="sync()">↻ ซิงค์ Feishu Base</button></header>
<main class="wrap"><div id="status" class="status">ยังไม่ได้ซิงค์</div><div id="cards" class="grid"></div>
<h2>Employees</h2><div style="overflow:auto"><table><thead><tr><th>EmployeeID</th><th>Name</th><th>Company</th><th>Salary</th><th>Status</th></tr></thead><tbody id="employees"></tbody></table></div></main>
<script>
const API=(localStorage.getItem('PAYROLL_API_URL')||'').replace(/\/$/,'');
const val=(f,n)=>{const v=f?.[n];if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.text||x.name||x.id||''):x).join(', ');return v??''};
async function sync(){const s=document.getElementById('status');s.textContent='กำลังเชื่อมต่อ Feishu...';
try{const r=await fetch(API+'/api/sync');const j=await r.json();if(!j.ok)throw new Error(j.error||'Sync failed');
const d=j.data;s.innerHTML='<span class="ok">● Connected</span> · '+new Date(j.syncedAt).toLocaleString('th-TH');
document.getElementById('cards').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><b>${k}</b><div>${v.status}</div><strong>${v.count}</strong> records</div>`).join('');
document.getElementById('employees').innerHTML=(d.employees?.records||[]).map(r=>`<tr><td>${val(r.fields,'EmployeeID')}</td><td>${val(r.fields,'Name')}</td><td>${val(r.fields,'Company')}</td><td>${val(r.fields,'Salary')}</td><td>${val(r.fields,'Status Employees')}</td></tr>`).join('');
}catch(e){s.innerHTML='<span class="bad">● Sync failed</span> · '+e.message;}}
</script></body></html>

services:
  - type: web
    name: mac-feishu-payroll-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_APP_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://mccyver-dev1.github.io
      - key: SESSION_SECRET
        sync: false
      - key: PAYROLL_ADMIN_USERNAME
        sync: false
      - key: PAYROLL_ADMIN_PASSWORD_HASH
        sync: false
